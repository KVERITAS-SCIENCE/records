id: kv:2610.00041v1
version: 1
title: 'Seben: Morphotactic-Guided Preference Alignment for Extremely Low-Resource Language'
authors:
- name: Sebastien Diarra
- name: Mamadou K. Keita
- name: Sokona Coulibaly
submitted_by:
  name: s7d11
  github: s7d11
  affiliation: RobotsMali
abstract: Preference-based post-training improves language models, but the standard methods use surface
  tokens as the training signal and target high-resource languages. We present Sɛbɛn, a post-training
  framework that adds morphotactic verification to the alignment loop for small language models in extremely
  low-resource languages. A rule-based morphological analyzer checks each generated analysis against a
  per-language grammar and dictionary, and a morpheme-level reward turns the check into a training signal
  for supervised fine-tuning, DPO, APO, and GRPO. The framework also gates automatic grammar and dictionary
  updates behind an integrity threshold. We run Sɛbɛn on the 13 national languages of Mali with five small
  models from 135M to 2B parameters and report morphological integrity, morpheme error rate, consistency,
  and an uncertainty-weighted cost on a seed-fixed held-out split. GRPO gives the lowest morpheme error
  rate for SmolLM2-135M, Gemma-4-E2B, and TinyLlama-1.1B, while the four arms tie for LFM2.5-230M. We
  record and seal every run with K-Veritas, so each reported score is bound to the computation that produced
  it and can be verified publicly. We report the full configuration and evaluation records so that others
  can reproduce the matrix.
