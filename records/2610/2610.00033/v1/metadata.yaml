abstract: Ran the README zero-shot evaluation for the released state-spaces/mamba-370m checkpoint with
  lm-evaluation-harness and the mamba_ssm backend, on the full LAMBADA, HellaSwag, PIQA, ARC-Easy, ARC-Challenge
  and WinoGrande sets, batch size 64. mamba_ssm and causal-conv1d were compiled at the pinned commits
  for sm_120 with CUDA 12.8 (MAMBA_KEEP_CUDA_BUILD=TRUE for the Mamba-1 kernels); apache-tvm-ffi was pinned
  to 0.1.9 so the bundled tilelang imports. One NVIDIA RTX 5060 Ti.
