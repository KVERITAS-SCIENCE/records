abstract: Trained 3D Gaussian Splatting with gsplat's simple_trainer.py default strategy at the pinned
  commit on the Mip-NeRF 360 garden scene at quarter resolution, 30,000 steps, with the built-in held-out
  evaluation (PSNR, SSIM, LPIPS) at 7,000 and 30,000 steps. gsplat and its CUDA dependencies were compiled
  for sm_120 with CUDA 12.8 and PyTorch 2.9.1 as pinned. One NVIDIA RTX 5060 Ti.
