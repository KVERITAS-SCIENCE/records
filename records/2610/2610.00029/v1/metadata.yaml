  name: K-Veritas Team
abstract: 'Ran the README quick start at the pinned commit on a single GPU: run_train.sh with NGPU=1 and
  the shipped llama3_debugmodel recipe (small Llama 3 architecture, the c4_test sample data bundled in
  the repository, AdamW lr 8e-4 with linear decay), extended from 10 to 2,000 steps through a two-line
  recipe wrapper (kv_recipes.py) because recipe settings are no longer command-line options. PyTorch nightly
  2.16.0.dev20261007 for CUDA 13.0, as the README requires a nightly build. One NVIDIA RTX 5060 Ti.'
