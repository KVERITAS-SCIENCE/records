title: 'Reproduction of karpathy/llm.c: GPT-2 124M fine-tuning on tinyshakespeare in CUDA'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Ran the llm.c quick start from the pinned commit: downloaded the starter pack (GPT-2 124M bf16
  weights, GPT-2 tokenizer, tokenized tinyshakespeare) with dev/download_starter_pack.sh, built train_gpt2cu
  with make (bf16, no cuDNN, single GPU, compute capability 12.0, CUDA 12.8 toolkit from conda-forge),
  and ran ./train_gpt2cu with its default settings: one epoch (74 steps) of fine-tuning at B=4, T=1024,
  AdamW lr 3e-4, with validation loss every 20 steps and sample generations. Training loss per step, validation
  loss, average iteration time and throughput are parsed from the program output. Single NVIDIA RTX 5060
  Ti 16 GB.'
