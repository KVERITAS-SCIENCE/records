title: 'Reproduction of huggingface/pytorch-image-models: resnet26d on Imagenette'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Trained timm resnet26d from scratch on Imagenette (10-class ImageNet subset, 160 px release)
  with train.py: 40 epochs, image size 160, batch 128, native AMP, timm default SGD with cosine schedule
  and 5 warmup epochs, seed 42, 10-class head. The listed hfds/frgfm/imagenette dataset is a script-based
  Hugging Face dataset that current datasets releases cannot load, so the same Imagenette data was taken
  from the official fast.ai archive (imagenette2-160.tgz) as an image folder. Validation top-1/top-5 every
  epoch. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch 2.11 cu128, Python 3.12.'
