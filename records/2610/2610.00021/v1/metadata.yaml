abstract: 'Re-ran TabM on the California housing dataset at the pinned commit with the paper''s 15 tuned
  evaluation configs (paper/exp/tabm/california/0-evaluation, seeds 0 to 14), and compared each test RMSE
  with the report stored in the repository for the same seed. Environment: PyTorch 2.11 with CUDA 12.8
  in place of the pinned 2.0.1 (the GPU needs it), other packages at the versions in pixi.toml, TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1
  for the checkpoint format. Datasets and stored results for other experiments were moved out of the working
  copy; Python''s hostname lookup returns localhost so it does not appear in log file names. One NVIDIA
  RTX 5060 Ti.'
