abstract: 'Ran train.py unmodified at the pinned commit: trains the Basic and Regex byte-pair-encoding
  tokenizers to a 512-token vocabulary on the repository''s sample text. The run then loads both saved
  tokenizers, checks that encoding round-trips the text, measures the compression ratio (bytes per token),
  and runs the repository''s test suite, which compares against tiktoken. CPU only, one machine.'
