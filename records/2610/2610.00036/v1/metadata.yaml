abstract: 'Ran the quickstart examples/quickstart/hf_llm.py at the pinned commit: greedy generation of
  100 tokens with a static cache, timed with Thunder''s benchmark_n over two runs, once in PyTorch eager
  mode and once compiled with Thunder''s hf-transformers recipe. The script''s default model, meta-llama/Llama-3.2-1B,
  is gated, so the first public model from its own list was used instead (deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B,
  bf16). PyTorch 2.8 with CUDA 12.8 to match the pinned nvFuser build. One NVIDIA RTX 5060 Ti.'
