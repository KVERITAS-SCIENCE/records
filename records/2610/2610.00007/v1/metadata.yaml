title: 'Reproduction of sthalles/SimCLR: SimCLR ResNet-18 on CIFAR-10 with linear evaluation'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Pretrained a ResNet-18 SimCLR model on CIFAR-10 with run.py (50 epochs, batch 256, Adam lr
  3e-4, temperature 0.07, fp16 mixed precision, the script''s fixed seed 0), then ran the repo''s linear
  evaluation from feature_eval/mini_batch_logistic_regression_evaluator.ipynb as a script: frozen backbone,
  logistic-regression head trained with Adam for 100 epochs on CIFAR-10, top-1/top-5 test accuracy each
  epoch. The notebook code is unchanged except that it loads the checkpoint just trained instead of downloading
  a published one; run.py gained one print per epoch of the values it already logs. CIFAR-10 downloaded
  by torchvision. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch 2.11 cu128, Python 3.12.'
