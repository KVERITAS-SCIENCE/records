title: 'Reproduction of pytorch/examples: Transformer word-level language model on WikiText-2'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Trained the word_language_model example from the pinned commit unmodified: a Transformer language
  model (default size: 200-dim embeddings, 2 layers, 2 heads, dropout 0.2) on the WikiText-2 copy shipped
  in the repo, 20 epochs, initial learning rate 5 with the script annealing schedule, seed 1111, on the
  GPU (--accel, which replaces the older --cuda flag). Validation loss and perplexity per epoch and the
  final test loss and perplexity are parsed from the script output. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch
  2.11 cu128, Python 3.12.'
