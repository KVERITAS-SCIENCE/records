abstract: 'Ran the three scripts in the repository''s benchmark/ folder at the pinned commit, unchanged,
  with the Whisper large-v3 model on CUDA: wer_benchmark.py over all 2703 utterances of LibriSpeech clean
  validation (streamed from the Hugging Face hub, normalized with the bundled English normalizer), speed_benchmark.py
  on the bundled benchmark.m4a (3 repeats of 10 transcriptions, minimum time reported) and memory_benchmark.py
  with --gpu_memory (peak GPU memory and power while transcribing benchmark.m4a). The tests/ and docker/
  folders are withheld as hash-only entries. CTranslate2 4.8 with cuBLAS and cuDNN 9 from PyPI, datasets
  3.6. One NVIDIA RTX 5060 Ti.'
