title: 'Reproduction of cloneofsimo/minRF: rectified-flow DiT on MNIST'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Ran rf.py at the pinned commit, unchanged, in its default MNIST setting: a class-conditional
  rectified-flow model with a small DiT (Llama-style, dim 64, 6 layers, 0.61M parameters), Adam at learning
  rate 5e-4, batch size 256, 100 epochs, sampling 16 images after each epoch. The reported values are
  the per-epoch training losses rf.py prints for ten bins of the flow time t. wandb was disabled and the
  sample GIFs are withheld as hash-only entries (the last-frame PNGs are kept). The repository''s CIFAR-10
  setting (--cifar, 13.3M parameters) was attempted but ran out of memory on its first step at its fixed
  batch size of 256 on this 16 GB GPU, so it is not part of this record. PyTorch 2.11 (CUDA 12.8). One
  NVIDIA RTX 5060 Ti.'
