abstract: 'Trained ResNet18 on CIFAR-10 with the repo''s main.py (SGD lr 0.1, momentum 0.9, weight decay
  5e-4, batch 128, random crop and flip, cosine schedule) for 50 epochs instead of 200, with the cosine
  T_max set to match. Two harness-only edits: ResNet18 selected in place of the default SimpleDLA, and
  the terminal progress bar prints only its final line per pass when stdout is not a TTY. Test accuracy
  evaluated every epoch. CIFAR-10 downloaded by torchvision. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch
  2.11 cu128, Python 3.12.'
