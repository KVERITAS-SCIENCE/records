abstract: 'Ran vLLM''s offline throughput benchmark with the released vLLM 0.31.0 package (PyTorch 2.13
  for CUDA 13.0, FlashInfer kernels compiled for sm_120 at startup): Qwen2.5-1.5B-Instruct on 2,000 random
  prompts of 512 input and 256 output tokens, default engine settings. The bundle holds the v0.31.0 tag''s
  benchmark code and project files; the rest of the source tree was set aside because the installed package,
  recorded in the signed environment, is what ran. One NVIDIA RTX 5060 Ti.'
