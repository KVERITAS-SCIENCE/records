abstract: 'Ran the README evaluation with lighteval at the pinned commit (accelerate backend): SmolLM2-1.7B-Instruct
  on the full ARC-Challenge test set with 25-shot prompts and the full HellaSwag validation set with 10-shot
  prompts, batch size 8. At this commit HellaSwag is scored generatively (exact match) rather than by
  log-likelihood accuracy. A fresh cache directory was used so every sample was computed in the sealed
  run. One NVIDIA RTX 5060 Ti.'
