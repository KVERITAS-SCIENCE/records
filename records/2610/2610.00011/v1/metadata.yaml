abstract: 'Ran airbench94_muon.py unmodified at the pinned commit: one compile warmup run followed by
  the script''s default 200 independent CIFAR-10 training runs (8 epochs each, Muon optimizer, torch.compile
  max-autotune), each evaluated with test-time augmentation; the script reports the mean and standard
  deviation of test accuracy over the 200 runs. CIFAR-10 downloaded by torchvision. Single NVIDIA RTX
  5060 Ti 16 GB, PyTorch 2.11 cu128, Python 3.12.'
