  name: K-Veritas Team
abstract: Ran three of the repository's kernel benchmarks at the pinned commit (fused linear cross entropy,
  RMSNorm, SwiGLU) on Triton 3.6 with PyTorch 2.11, comparing Liger's kernels with the baseline each script
  uses (Hugging Face modules, or plain PyTorch for fused linear cross entropy) in speed and peak memory,
  forward, backward and full passes. The report holds the geometric-mean ratio of baseline to Liger over
  each script's sweep; values above 1 favour Liger. On this GPU the fused linear cross entropy kernel
  uses less memory but is slower than the PyTorch baseline. One NVIDIA RTX 5060 Ti (Blackwell, sm_120).
