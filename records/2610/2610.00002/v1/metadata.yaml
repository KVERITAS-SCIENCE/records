  name: K-Veritas Team
abstract: 'Trained the repo''s 6.3M-parameter Vision Transformer from scratch on CIFAR-10 with the README
  command (200 epochs, Adam lr 1e-3, 5 warmup epochs then cosine, label smoothing, AutoAugment, 16-bit
  mixed precision, seed 42), logging with the CSV logger since no Comet key is used. Compatibility changes
  for current Python and PyTorch: pytorch-lightning 1.5.10 instead of the pinned 1.2.1, np.int replaced
  by int in autoaugment.py, and the per-epoch lr log call given on_epoch=True. Validation accuracy each
  epoch from the logged metrics. CIFAR-10 downloaded by torchvision. Single NVIDIA RTX 5060 Ti 16 GB,
  PyTorch 2.11 cu128, Python 3.12.'
