title: 'Reproduction of IDEA-Research/GroundingDINO: zero-shot COCO detection with GroundingDINO-T'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Ran demo/test_ap_on_coco.py at the pinned commit with the GroundingDINO_SwinT_OGC config and
  the released groundingdino_swint_ogc.pth weights on all 5000 COCO val2017 images, zero-shot: the 80
  category names joined into one text prompt, top 300 boxes per image, box AP from pycocotools. Weight
  and annotation SHA-256 hashes are printed in the run; bert-base-uncased was cached beforehand and the
  run was offline. One change to the code: the multi-scale deformable attention CUDA extension (ms_deform_attn_cuda.cu)
  used value.type() in two AT_DISPATCH macros, which current PyTorch no longer accepts, so it now uses
  value.scalar_type(); the extension was compiled for this GPU with CUDA 12.8. PyTorch 2.11, transformers
  4.49. One NVIDIA RTX 5060 Ti.'
