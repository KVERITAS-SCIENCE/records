abstract: 'Ran the shipped example examples/train_lora/qwen3_lora_sft.yaml at the pinned commit unchanged
  except for the local model path and output directory: LoRA (rank 8, all linear layers) supervised fine-tuning
  of Qwen3-4B-Instruct-2507 on the bundled identity and alpaca_en_demo datasets (up to 1,000 samples each),
  3 epochs, batch 1 with 8 accumulation steps, learning rate 1e-4 cosine, bf16. torchaudio was replaced
  with the CUDA 12.8 build matching PyTorch. One NVIDIA RTX 5060 Ti.'
