title: 'Reproduction of jiaweizzhao/GaLore: LLaMA-60M pre-training on C4 with GaLore'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Pre-trained LLaMA-60M on streamed C4 with the GaLore AdamW optimizer using the README command
  at the pinned commit (rank 128, scale 0.25, projection update every 200 steps, lr 0.01, bf16), for 2,000
  steps instead of 10,000 to fit the time budget, with evaluation every 500 steps. Changes needed on this
  machine: micro-batch 64 with the same total batch of 512 (256 does not fit 16 GB), transformers 4.40.2
  instead of the pinned 4.31 (no Python 3.12 build), and the validation set loaded as allenai/c4 instead
  of the retired c4 name. One NVIDIA RTX 5060 Ti.'
