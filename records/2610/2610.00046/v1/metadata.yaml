title: 'Reproduction of WongKinYiu/yolov9: COCO val2017 evaluation of YOLOv9-S, M, C and E'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Evaluated the four released converted checkpoints (yolov9-s, -m, -c and -e from release v0.1)
  with the repository''s val.py at the pinned commit on COCO val2017 (5000 images, labels from the yolov5
  coco2017labels-segments archive), using the README''s settings: image size 640, confidence 0.001, IoU
  0.7, --save-json, with box mAP computed by pycocotools. Batch size 32, except 16 for YOLOv9-E, which
  does not fit in 16 GB of GPU memory at 32. Weight file SHA-256 hashes are printed in the run. The figure/
  folder is withheld as hash-only entries. Changes to the environment only: PyTorch 2.11 (CUDA 12.8) with
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 to load the pickled checkpoints, NumPy 2.3 (np.trapz) and Pillow
  9.5 (FreeTypeFont.getsize), plus IPython which models/common.py imports. One NVIDIA RTX 5060 Ti.'
