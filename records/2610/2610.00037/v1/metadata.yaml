abstract: 'Pruned OPT-1.3B with the repository''s main_opt.py at the pinned commit and measured WikiText-2
  perplexity for three settings: Wanda at 50% unstructured sparsity, Wanda with 2:4 semi-structured sparsity,
  and the magnitude-pruning baseline at 50% unstructured, each with 128 C4 calibration samples. Changes:
  transformers 4.40 and PyTorch 2.11 instead of the pinned 4.28 and 1.10, and lib/data.py loads C4 without
  the retired ''allenai--c4'' config name (same data files). One NVIDIA RTX 5060 Ti.'
