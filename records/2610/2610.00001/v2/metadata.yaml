id: kv:2610.00001v2
version: 2
title: 'Sebeni morphotactic post-training on MULTI13: SFT, DPO, APO and GRPO arms with SmolLM2-135M'
authors:
- name: Sebastien Diarra
submitted_by:
  name: Sebastien Diarra
  github: s7d11
abstract: 'Three post-training arms of Sebeni, a morphotactic generation toolkit for extremely low-resource
  Manding languages, on the MULTI13 scope (13 languages). Each arm distils the grammar and dictionary,
  fine-tunes SmolLM2-135M with 4-bit LoRA for 500 steps on the packaged 300-sample dataset with a 10%
  held-out split, and scores the held-out test set (phi, MER, MCS, UWEC). Code: github.com/mlsftwrs/sebeni
  at commit 8e66775, with K-Veritas capture added to the CLI.'
tags:
- nlp
- low-resource-languages
- manding
- morphology
- post-training
license: MIT
purpose: Official implementation
type: Research paper
field: Natural language processing
code: https://github.com/mlsftwrs/sebeni
published: '2026-10-10'
status: published
issue: 32
changes:
  text: 'Added the GRPO arm (r4), run with the same commit, settings and K-Veritas capture as the SFT,
    DPO and APO arms. One difference: GRPO evaluates the held-out split once, at step 500, instead of
    every 50 steps, because one evaluation takes about 3 hours on this GPU. Like the other arms, sebeni
    eval reports checkpoint_id baseline, so the test scores match the other arms.'
  by: Mamadou2727
