id: kv:2610.00001v1
version: 1
title: 'Sebeni morphotactic post-training on MULTI13: SFT, DPO and APO arms with SmolLM2-135M'
authors:
- name: Sebastien Diarra
submitted_by:
  name: Sebastien Diarra
abstract: 'Three post-training arms of Sebeni, a morphotactic generation toolkit for extremely low-resource
  Manding languages, on the MULTI13 scope (13 languages). Each arm distils the grammar and dictionary,
  fine-tunes SmolLM2-135M with 4-bit LoRA for 500 steps on the packaged 300-sample dataset with a 10%
  held-out split, and scores the held-out test set (phi, MER, MCS, UWEC). Code: github.com/mlsftwrs/sebeni
  at commit 8e66775, with K-Veritas capture added to the CLI.'
