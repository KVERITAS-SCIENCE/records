abstract: 'Ran the lora_finetune_single_device recipe with the shipped config qwen2_5/0.5B_lora_single_device
  at the pinned commit: LoRA (rank 32) fine-tuning of Qwen2.5-0.5B-Instruct on alpaca-cleaned for one
  epoch, bf16, batch 2 with 8 accumulation steps, seed 42; only the model and output paths were overridden.
  With the config''s default learning rate (2e-3, no gradient clipping) the loss falls until the end of
  warmup at step 100, then diverges and does not recover. One NVIDIA RTX 5060 Ti.'
