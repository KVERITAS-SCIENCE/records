id: kv:2610.00014v1
version: 1
title: 'Reproduction of LAION-AI/CLIP_benchmark: zero-shot classification of OpenCLIP ViT-B-32 (LAION-2B)
  on CIFAR-10, CIFAR-100 and STL-10'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: Ran the clip_benchmark CLI from the pinned commit (installed editable) to evaluate the OpenCLIP
  ViT-B-32 model with the laion2b_s34b_b79k weights in zero-shot classification on the CIFAR-10, CIFAR-100
  and STL-10 test sets, with the default English class names and prompt templates, batch size and AMP
  settings. Top-1, top-5 and mean per-class recall are read from the result JSON files the tool wrote
  during the sealed run. Datasets downloaded by torchvision and weights fetched from Hugging Face before
  the sealed run. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch 2.11 cu128, Python 3.12.
