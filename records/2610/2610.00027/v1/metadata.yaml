abstract: 'Built htsim at the pinned commit and ran the shipped experiment experiments/fattree-all-to-all/sequential_512conns:
  a 512-host sequential (shift) all-to-all with NDP and per-packet spraying on a 1024-node three-tier
  fat tree, 1 MB flows, seed 13, using the repository''s own run.sh and post-processing scripts. The result
  of interest is the self-synchronization described in the experiment''s README: how many senders converge
  on a single receiver. The final gnuplot step was skipped (gnuplot not installed); the older example
  programs under sim/datacenter/old_tests do not compile at this commit and were not used. Single-threaded
  simulation on an Intel Xeon W-2145.'
