abstract: Trained LeRobot's Diffusion Policy on the lerobot/pusht dataset at the pinned commit for 20,000
  steps (batch 64, seed 1000, default diffusion settings), a tenth of the 200,000-step budget used for
  the published checkpoint, and evaluated it in the gym-pusht simulator on 50 episodes at 10,000 and 20,000
  steps (success rate and maximum coverage reward). Evaluation ran in-process (use_async_envs=false) because
  the asynchronous evaluation workers could not load the simulator. One NVIDIA RTX 5060 Ti.
