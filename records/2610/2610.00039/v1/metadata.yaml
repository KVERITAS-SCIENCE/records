id: kv:2610.00039v1
version: 1
title: 'Reproduction of jwkirchenbauer/lm-watermarking: watermark detection with OPT-1.3B'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: Ran the repository's demo_watermark.py at the pinned commit with facebook/opt-1.3b and the default
  watermark settings (gamma 0.25, delta 2.0, simple_1 seeding, multinomial sampling at temperature 0.7,
  200 new tokens, z-score threshold 4.0), once for each of five generation seeds (123, the default, then
  1 to 4). Each run continues the script's built-in prompt with and without the watermark and runs the
  detector on both outputs, reporting the z-score and greenlist fraction. The experiments/, watermark_reliability_release/
  and hf_hub_space_demo/ folders are withheld as hash-only entries since this run does not use them. PyTorch
  2.11 (CUDA 12.8), transformers 5.19. One NVIDIA RTX 5060 Ti.
