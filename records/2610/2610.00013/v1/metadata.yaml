title: 'Reproduction of tinygrad/tinygrad: hlb_cifar10 and beautiful_mnist examples'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Ran two training examples from tinygrad at the pinned commit, unmodified and with their default
  settings, on the NV backend: examples/hlb_cifar10.py (the hlb-CIFAR10 speedrun port, 1000 steps at batch
  size 512, fixed seed 201 from the script hyperparameters, test accuracy evaluated by the script) and
  then examples/beautiful_mnist.py (small convolutional network, Adam, 70 steps at batch size 512, test
  accuracy at the end). Training loss every 50 steps, CIFAR-10 test accuracy and the final MNIST loss
  and test accuracy are parsed from the script output. CIFAR-10 and MNIST fetched by tinygrad before the
  sealed run; CUDA NVRTC 12.8 from conda-forge as the kernel compiler. Single NVIDIA RTX 5060 Ti 16 GB,
  Python 3.12.'
