abstract: 'Evaluated the authors'' released OT-CFM CIFAR-10 weights (400,000 training steps, release 1.0.4)
  with the repository''s compute_fid.py and the README settings at the pinned commit: 50,000 samples generated
  with the adaptive dopri5 solver (tolerance 1e-5) and FID computed against the CIFAR-10 training set
  with clean-fid. Training was not repeated (400,000 steps exceeds the time budget); the weights file
  is attested by hash in the report. SciPy was pinned below 1.16 for clean-fid compatibility. One NVIDIA
  RTX 5060 Ti.'
