abstract: 'Fine-tuned the pretrained YOLO11n detector on COCO128 with the yolo CLI from the pinned commit
  (installed editable): 100 epochs, image size 640, default hyperparameters, seed 0, plots disabled; then
  validated the best checkpoint with yolo detect val. Per-epoch box loss and mAP from results.csv; final
  precision, recall, mAP50 and mAP50-95 from the validation run. COCO128 and yolo11n.pt fetched by Ultralytics
  before the sealed run. Single NVIDIA RTX 5060 Ti 16 GB, PyTorch 2.11 cu128, Python 3.12.'
