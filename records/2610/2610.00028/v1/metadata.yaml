title: 'Reproduction of karpathy/llama2.c: 15M-parameter Llama 2 trained on TinyStories'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: Trained the README's smallest Llama 2 configuration (dim 288, 6 layers, 6 heads, about 15M parameters,
  Llama 2 tokenizer) on the pretokenized TinyStories dataset at the pinned commit with train.py defaults
  (batch 128, 4 gradient accumulation steps, bf16, torch.compile, seed 1337) for 15,000 iterations instead
  of the README's 20,000 to fit the time budget; the learning-rate schedule follows the shorter run. The
  exported model was then sampled with the C inference program run.c (256 tokens, temperature 0.8, seed
  42). One NVIDIA RTX 5060 Ti.
