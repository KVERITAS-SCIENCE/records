abstract: 'Evaluated the BAAI/bge-base-en-v1.5 embedding model with the repository''s BEIR evaluation
  module (FlagEmbedding.evaluation.beir) at the pinned commit: dense retrieval without a reranker on the
  test splits of SciFact, NFCorpus and FiQA, top 1000 retrieved, reporting nDCG@10 and Recall@100. Corpus
  embeddings were computed during the run. The research/ and examples/finetune/ folders are withheld as
  hash-only entries since this run does not use them. PyTorch 2.11 (CUDA 12.8). One NVIDIA RTX 5060 Ti.'
