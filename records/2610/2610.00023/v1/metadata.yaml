abstract: 'Built Valkey from source at the pinned commit (make, default settings, jemalloc) and ran the
  bundled valkey-benchmark against a local server with persistence disabled: 2,000,000 requests, 50 parallel
  clients, pipeline depth 16, for SET, GET, LPUSH and LPOP, reporting requests per second and latency
  percentiles. Server and benchmark ran on the same machine (Intel Xeon W-2145, 16 threads).'
