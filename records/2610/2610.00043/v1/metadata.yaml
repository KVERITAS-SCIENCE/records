title: 'Reproduction of huggingface/open_asr_leaderboard: Whisper large-v3-turbo on the seven English
  test sets'
authors:
- name: K-Veritas Team
submitted_by:
  name: K-Veritas Team
abstract: 'Ran transformers/run_whisper.sh at the pinned commit, unchanged: openai/whisper-large-v3-turbo
  with batch size 64 on the full test splits of AMI, GigaSpeech, VoxPopuli, Earnings-22, LibriSpeech test-clean
  and test-other and SPGISpeech from hf-audio/open-asr-leaderboard, reporting WER and RTFx per set, then
  normalizer/eval_utils.score_results. The dataset and model weights were downloaded before the sealed
  run, which ran offline. Folders for the other toolkits (nemo_asr, espnet, ctranslate2 and so on) are
  withheld as hash-only entries since this run does not use them. PyTorch 2.11 (CUDA 12.8), transformers
  5.19, datasets 5.1 with torchcodec for audio decoding. One NVIDIA RTX 5060 Ti.'
