  name: K-Veritas Team
abstract: 'Ran NeuralSAT (src/main.py, default settings, as vnncomp_scripts/run_instance.sh calls it)
  at the pinned commit on all 186 instances of the VNN-COMP 2023 acasxu benchmark (45 ACAS Xu networks,
  properties 1 to 10, per-instance timeout from instances.csv, 116 s for most), one instance at a time,
  counting unsat, sat, timeout and error verdicts and the wall-clock time per instance. Benchmark files
  come from the ChristopherBrix/vnncomp2023_benchmarks repository; their SHA-256 hashes are printed at
  the start of the run. One instance (network 1_9, property 7) did not honour its 116 s timeout: the process
  ran for about 17.7 hours without writing a result and is counted as error, which accounts for most of
  the run''s duration. The src/example folder (109 MB of sample networks) was moved out since the run
  does not use it. Newer packages than requirements.txt pins (PyTorch 2.11 with CUDA 12.8, gurobipy 13
  with its restricted license). One NVIDIA RTX 5060 Ti.'
