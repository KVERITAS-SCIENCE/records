abstract: 'Ran the plb2 programming-language benchmark at the pinned commit: the nqueen, matmul, sudoku
  and bedcov tasks in C (gcc 13, -O3 -flto), Rust, Go, Java, JavaScript (Node.js), Python (CPython 3.12)
  and Julia, compiled with each language''s Makefile where one exists, one timed run per program on an
  Intel Xeon W-2145. Each program''s last output line is kept in the log. At this commit the JavaScript
  sudoku exits with an error, and the Rust bedcov reports a different overlap count from the other languages.'
