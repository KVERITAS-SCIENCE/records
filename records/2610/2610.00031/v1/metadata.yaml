abstract: 'Built bitnet.cpp at the pinned commit with setup_env.py (clang 18, i2_s kernels) and ran the
  README benchmark utils/e2e_benchmark.py on the official BitNet-b1.58-2B-4T GGUF: 512-token prompt processing
  and 128-token generation, batch 1, 8 threads, CPU only, 5 repetitions. At this commit e2e_benchmark.py
  exits with status 1 even on success, so success was judged by its result table. Intel Xeon W-2145.'
