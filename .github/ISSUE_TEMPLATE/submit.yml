name: Submit a record
description: Publish sealed K-Veritas reports as a record.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [rules](https://github.com/KVERITAS-SCIENCE/records#rules) first. Automatic checks run when you submit; a failed check rejects the submission.
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: One per line, in order. `Name` or `Name (Affiliation)`.
    validations:
      required: true
  - type: input
    id: submitter
    attributes:
      label: Your name
      description: Shown as "Submitted by", with your GitHub account.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Your affiliation
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      description: What the experiments do. Plain text.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma separated.
  - type: input
    id: license
    attributes:
      label: Code licence
      placeholder: MIT
    validations:
      required: true
  - type: dropdown
    id: purpose
    attributes:
      label: Purpose
      description: An independent reproduction must link the original code.
      options:
        - Official implementation
        - Independent reproduction
        - Other
    validations:
      required: true
  - type: dropdown
    id: work_type
    attributes:
      label: Type of work
      options:
        - Research paper
        - Thesis
        - Course assignment
        - Benchmark or leaderboard entry
        - Artifact evaluation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: course
    attributes:
      label: Course assignment
      description: Only for course assignments.
      options:
        - label: The instructor allows publishing this assignment.
  - type: dropdown
    id: field
    attributes:
      label: Field
      options:
        - Machine learning
        - Natural language processing
        - Computer vision
        - Robotics
        - Systems and performance
        - Databases
        - Networking
        - Security and cryptography
        - Programming languages and compilers
        - Algorithms and theory
        - Human-computer interaction
        - Scientific computing
        - Bioinformatics and health
        - Physics and astronomy
        - Chemistry and materials
        - Earth and climate
        - Engineering
        - Mathematics and statistics
        - Economics and social science
        - Other
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper link
      description: Optional, can be added later with an update.
      placeholder: https://arxiv.org/abs/...
  - type: input
    id: code
    attributes:
      label: Code repository
      description: Optional. Where you host the code.
      placeholder: https://github.com/...
  - type: input
    id: original
    attributes:
      label: Original code
      description: Required for an independent reproduction. The code being reproduced.
      placeholder: https://github.com/...
  - type: textarea
    id: reports
    attributes:
      label: Sealed reports
      description: Drag the report PDFs here, in order. Sealed through the K-Veritas server with `--disclosure open`.
    validations:
      required: true
  - type: textarea
    id: labels
    attributes:
      label: Report labels
      description: One short label per line, same order as the reports (e.g. Main results).
    validations:
      required: true
  - type: textarea
    id: bundles
    attributes:
      label: Code bundles
      description: Drag every `.kvbundle.zip` here. Matched to reports by the hash each report signed.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I ran these experiments, or the authors asked me to submit them.
          required: true
        - label: The bundles contain no secrets (keys, tokens, passwords) and nothing I may not publish.
          required: true
        - label: Records are public and permanent; corrections are new versions.
          required: true
