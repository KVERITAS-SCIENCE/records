name: Update a record
description: Publish a new version of a record you submitted.
title: "[Update] kv:"
labels: ["update"]
body:
  - type: markdown
    attributes:
      value: |
        Only the original submitter or a maintainer can update a record. Leave a field empty to keep it.
        Adding or removing reports publishes a new version; earlier versions stay. Any other change corrects the current version in place and is logged.
  - type: input
    id: record
    attributes:
      label: Record ID
      placeholder: 2610.00001
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: Shown on the record.
    validations:
      required: true
  - type: textarea
    id: add
    attributes:
      label: Add reports
      description: Drag new report PDFs here, in order.
  - type: textarea
    id: add_labels
    attributes:
      label: Labels for added reports
      description: One per line, same order.
  - type: textarea
    id: bundles
    attributes:
      label: Code bundles
      description: Bundles for the added reports. Existing reports keep theirs.
  - type: input
    id: remove
    attributes:
      label: Remove reports
      placeholder: r2, r3
  - type: input
    id: title
    attributes:
      label: Title
  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: Full list, one per line. Replaces the current list.
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
  - type: input
    id: tags
    attributes:
      label: Tags
  - type: input
    id: license
    attributes:
      label: Code licence
  - type: dropdown
    id: purpose
    attributes:
      label: Purpose
      description: Leave empty to keep.
      options:
        - Official implementation
        - Independent reproduction
        - Other
    validations:
      required: false
  - type: dropdown
    id: work_type
    attributes:
      label: Type of work
      description: Leave empty to keep.
      options:
        - Research paper
        - Thesis
        - Course assignment
        - Benchmark or leaderboard entry
        - Artifact evaluation
        - Other
    validations:
      required: false
  - type: checkboxes
    id: course
    attributes:
      label: Course assignment
      description: Only for course assignments.
      options:
        - label: The instructor allows publishing this assignment.
  - type: dropdown
    id: field
    attributes:
      label: Field
      description: Leave empty to keep.
      options:
        - Machine learning
        - Natural language processing
        - Computer vision
        - Robotics
        - Systems and performance
        - Databases
        - Networking
        - Security and cryptography
        - Programming languages and compilers
        - Algorithms and theory
        - Human-computer interaction
        - Scientific computing
        - Bioinformatics and health
        - Physics and astronomy
        - Chemistry and materials
        - Earth and climate
        - Engineering
        - Mathematics and statistics
        - Economics and social science
        - Other
    validations:
      required: false
  - type: input
    id: paper
    attributes:
      label: Paper link
      description: Optional.
      placeholder: https://arxiv.org/abs/...
  - type: input
    id: code
    attributes:
      label: Code repository
      description: Optional. Where you host the code.
      placeholder: https://github.com/...
  - type: input
    id: original
    attributes:
      label: Original code
      description: Required for an independent reproduction. The code being reproduced.
      placeholder: https://github.com/...
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I ran these experiments, or the authors asked me to submit them.
          required: true
        - label: The bundles contain no secrets (keys, tokens, passwords) and nothing I may not publish.
          required: true
        - label: Records are public and permanent; corrections are new versions.
          required: true
